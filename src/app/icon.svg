      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="kc" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fafafa"/>
      <stop offset="1" stop-color="#d4d4d8"/>
    </linearGradient>
    <linearGradient id="kh" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
